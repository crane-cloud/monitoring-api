version: "3"
services:
  database:
    restart: always
    image: postgres:10.8-alpine
    container_name: monitoring-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: cc-monitoring
    ports:
      - "4240:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monitoring-api
    networks:
      - cranecloud
      - default
    environment:
      FLASK_APP_SECRET:
      JWT_SALT:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
      FLASK_ENV: development
      FLASK_DEBUG: 1
      DATABASE_USER: postgres
      DATABASE_URI: ${DATABASE_URI:-postgresql://postgres:postgres@database:5432/monitor}
      TEST_DATABASE_URI: ${TEST_DATABASE_URI:-postgresql://postgres:postgres@database:5432/monitor_test}
      FLASK_APP: server.py
      PRODUCT_BASE_URL: ${PRODUCT_BASE_URL:-http://flask-api:5000}
    ports:
      - "${FLASK_PORT:-4000}:5000"
    volumes:
      - .:/app
    depends_on:
      - database
    links:
      - database

volumes:
  db-data:

networks:
  cranecloud:
    external: true
    name: cranecloud_default
